[build-system]
requires = ["scikit-build-core>=0.10.0"]
build-backend = "scikit_build_core.build"

[project]
name = "neptune-mlir"
version = "0.1.0"
description = "Neptune MLIR optimizer and Python translators."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sympy>=1.14"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
export = ["torch", "torch-mlir"]

[project.scripts]
neptune-export-attn = "neptune_mlir.operator.export_attention:main"

[tool.scikit-build]
cmake.version = ">=3.20"
wheel.packages = ["src/neptune_mlir"]

[tool.ruff]
line-length = 100
